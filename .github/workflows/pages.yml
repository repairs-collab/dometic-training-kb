name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the validated production build to GitHub Pages
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install application dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install -e ".[dev]"
          pnpm exec playwright install --with-deps chromium

      - name: Run unit and content tests
        run: |
          pnpm typecheck
          pnpm test
          python -m pytest -v

      - name: Build and verify the test-auth site
        run: |
          pnpm build:data
          pnpm build:test-auth
          pnpm verify:dist

      - name: Run browser acceptance tests
        run: pnpm test:e2e

      - name: Build and verify the production site
        run: |
          pnpm build
          pnpm verify:dist

      - name: Configure GitHub Pages
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
        uses: actions/configure-pages@v6

      - name: Upload verified Pages artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
