name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install application dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install -e .
          pnpm exec playwright install --with-deps chromium

      - name: Run unit and content tests
        run: |
          pnpm test
          python -m pytest -v

      - name: Build and verify the static site
        run: |
          pnpm build:data
          pnpm build
          pnpm verify:dist

      - name: Run browser acceptance tests
        run: pnpm test:e2e

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
